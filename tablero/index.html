<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indicadores CONVIVE 360°</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Tablero de gestión: franja azul marino con el periodo y las metas → grupos A–F en filas escaneables → mapa y hallazgos. */
:root{--bg:#f4f6f9;--sup:#ffffff;--tx:#0d1f3c;--tx2:#4a5a73;--borde:#d9e0ea;--navy:#0d1f3c;--azul:#0053bb;--teal:#2e86ab;
  --ok:#1e8e4e;--ok-l:#e7f5ec;--mal:#c0392b;--mal-l:#fbeae8;--warn:#c76a12;--warn-l:#fdf1e4;--neutro:#eef1f5;--barra:#cfd8e6;
  --f:'Public Sans',Arial,Helvetica,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--sup:#122036;--tx:#e8eef7;--tx2:#a6b4c8;--borde:#22344f;--navy:#08101d;
  --azul:#5b9cf0;--teal:#5fb3d3;--ok:#4cc27e;--ok-l:#12301f;--mal:#ef7d70;--mal-l:#3a1814;--warn:#f0a35a;--warn-l:#3a2610;--neutro:#1a2a42;--barra:#2c4060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--sup:#122036;--tx:#e8eef7;--tx2:#a6b4c8;--borde:#22344f;--navy:#08101d;--azul:#5b9cf0;--teal:#5fb3d3;
  --ok:#4cc27e;--ok-l:#12301f;--mal:#ef7d70;--mal-l:#3a1814;--warn:#f0a35a;--warn-l:#3a2610;--neutro:#1a2a42;--barra:#2c4060;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums}
.envoltura{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.franja{background:#0d1f3c;color:#fff;padding-block:22px 26px;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px)}
.marca{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:12px;background:#0053bb;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.3px}
h1{margin:0;font-size:clamp(20px,3vw,26px);line-height:1.15;text-wrap:balance}
.sub{color:#b9c8dd;font-size:13px;margin-top:3px}
.acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);color:#fff;background:transparent;border-radius:10px;padding:8px 12px;font:600 13px var(--f);text-decoration:none;cursor:pointer}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.12);outline:2px solid transparent}
.btn.claro{border-color:var(--borde);color:var(--tx);background:var(--sup)}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.meta{background:#132a4d;border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border:1px solid #23406b;cursor:pointer;text-align:left;color:#fff;font:inherit}
.meta:focus-visible{outline:2px solid #8fb6ee}
.meta .et{font-size:12px;color:#b9c8dd;letter-spacing:.3px}
.meta .val{font-size:30px;font-weight:800;line-height:1}
.meta .fr{font-size:12px;color:#b9c8dd}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;width:max-content}
.pill.cumple{background:#1e8e4e;color:#fff}.pill.nocumple{background:#c0392b;color:#fff}.pill.sinmeta{background:var(--neutro);color:var(--tx2)}.pill.sindatos{background:var(--neutro);color:var(--tx2)}
.meta .pill.sinmeta,.meta .pill.sindatos{background:#23406b;color:#cfdcef}
.prog{height:6px;border-radius:3px;background:#23406b;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:#8fb6ee;border-radius:3px}
.prog b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding-block:18px 6px}
.filtros label{display:grid;gap:4px;font-size:12px;color:var(--tx2);font-weight:600}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--borde);background:var(--sup);color:var(--tx);min-width:170px}
.aviso{font-size:13px;color:var(--tx2);background:var(--sup);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-top:8px}
main{display:grid;gap:22px;padding-block:10px 40px}
section.grupo{background:var(--sup);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
section.grupo>h2{margin:0;padding:14px 18px;font-size:16px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--borde);text-wrap:balance}
section.grupo>h2 span.l{font:500 13px var(--mono);color:var(--teal)}
section.grupo>h2 small{color:var(--tx2);font-weight:400;font-size:13px}
.fila{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--borde)}
.fila:last-child{border-bottom:0}
.kid{font:500 13px var(--mono);color:var(--tx2)}
.nom{font-weight:600}.nom small{display:block;font-weight:400;color:var(--tx2);font-size:12.5px}
.valor{font-weight:800;font-size:18px}.valor small{display:block;font-weight:400;font-size:12px;color:var(--tx2)}
.valor.sd{font-weight:600;font-size:14px;color:var(--tx2)}
.nota{font-size:12.5px;color:var(--tx2);min-width:0}
.mini{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.lnk{background:none;border:0;color:var(--azul);font:600 13px var(--f);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.barras{padding:14px 18px;display:grid;gap:8px}
.barra{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
.barra .pista{height:14px;background:var(--neutro);border-radius:4px;position:relative}
.barra .pista i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:4px}
.barra .pista b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mal)}
.barra .num{text-align:right;color:var(--tx2)}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0}
.dos>div{min-width:0;border-right:1px solid var(--borde)}.dos>div:last-child{border-right:0}
.dos h3{font-size:13px;margin:12px 18px 0;color:var(--tx2);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
svg text{fill:var(--tx2);font:12px var(--f)}
#mapa{height:430px;background:var(--neutro)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px;font-size:12.5px;color:var(--tx2)}
.punto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 18px;border-bottom:1px solid var(--borde);vertical-align:top}
th{color:var(--tx2);font-weight:700;font-size:12px;letter-spacing:.3px;text-transform:uppercase}
.tipo{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tipo.humano{background:var(--warn-l);color:var(--warn)}.tipo.sistema{background:var(--mal-l);color:var(--mal)}.tipo.revisar{background:var(--neutro);color:var(--tx2)}
.tabla{overflow-x:auto}
dialog{border:0;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 32px);background:var(--sup);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,16,29,.55)}
.dlg h3{margin:0;padding:18px 20px 4px;font-size:18px;text-wrap:balance}
.dlg .pq{padding:0 20px 10px;color:var(--tx2);font-size:13.5px}
.dlg dl{margin:0;padding:6px 20px 8px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.dlg dt{color:var(--tx2);font-weight:600}.dlg dd{margin:0}
.dlg footer{padding:12px 20px 18px;display:flex;justify-content:flex-end}
footer.pie{color:var(--tx2);font-size:12.5px;padding-block:0 30px}
@media (max-width:760px){.fila{grid-template-columns:44px minmax(0,1fr) auto;}.fila .nota{grid-column:2 / -1}.fila .mini{grid-column:3;grid-row:1}
  .barra{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 92px}.dlg dl{grid-template-columns:1fr}.acciones{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<header class="franja"><div class="envoltura">
  <div class="marca">
    <div class="logo" aria-hidden="true">360°</div>
    <div><h1>Tablero de indicadores · CONVIVE 360°</h1>
      <div class="sub" id="sub"></div></div>
    <div class="acciones">
      <a class="btn" id="lnkExcel" href="#" target="_blank" rel="noopener">⬇ Excel de auditoría</a>
      <a class="btn" id="lnkBoletin" href="#" target="_blank" rel="noopener">📄 Boletín del mes</a>
      <button class="btn" id="btnFichas" type="button">Fichas de los indicadores</button>
    </div>
  </div>
  <div class="metas" id="metas"></div>
</div></header>

<div class="envoltura">
  <div class="filtros">
    <label for="fMes">Periodo<select id="fMes"></select></label>
    <label for="fDim">Ver por<select id="fDim"><option value="total">Total de la localidad</option><option value="área">Área</option><option value="UPZ">UPZ</option></select></label>
    <label for="fVal" id="lblVal" hidden>Cuál<select id="fVal"></select></label>
  </div>
  <div class="aviso" id="aviso"></div>
</div>

<main class="envoltura" id="contenido"></main>

<script>const D = {"ruta":"https://script.google.com/macros/s/AKfycbwi6BllrgobQjspAHppkSxqTiwubOYMBuJEQJ3Iq6KsomEeRhyfSqvYLtOFPEWRTXY/exec?recurso=indicadores","grupos":{"A":"Ejecución y cumplimiento · ¿hacemos lo que programamos?","B":"Resultados sobre las problemáticas · ¿estamos resolviendo?","C":"Alcance y enfoque diferencial · ¿a quién llegamos?","D":"Percepción y convivencia · ¿cambia lo que siente la comunidad?","E":"Alineación estratégica · ¿aportamos al PISCCJ y al PDL?","F":"Calidad del dato · ¿podemos confiar en las cifras?"},"fichas":[{"id":"K1","grupo":"A","nombre":"Tasa de ejecución","pregunta":"¿Qué parte de lo programado se ejecutó?","definicion":"Porcentaje de actividades programadas (no canceladas) que se realizaron y se reportaron, con 3 días de gracia para reportar.","formula":"realizadas con reporte ÷ (programadas − canceladas) × 100","numerador":"Actividades con código SC- válido, fecha de la actividad en el periodo y un reporte que no dice «No se realizó»","denominador":"Actividades con código SC- válido y fecha de la actividad en el periodo, menos las CANCELADAS; las de los últimos 3 días antes del corte no entran","unidad":"%","sentido":"sube","fuente":["Agendamiento","Reportes"],"columnas":["AG: CODIGO_ACTIVIDAD (AD), FECHA (V), ESTADO (Z)","RP: CODIGO_AGENDAMIENTO, SE_REALIZO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ","línea PISCCJ"],"linea_base":"sí","desde":"histórico","meta":"≥ 90 % (aprobada por el administrador del sistema el 23-nov-2026; pendiente de aval de la gerencia)","meta_valor":90,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Indicador principal del modelo. Cada SC- cuenta una sola vez aunque tenga varios reportes. Se filtra por la fecha de la actividad, nunca por la fecha del código."},{"id":"K2","grupo":"A","nombre":"Causas de no realización","pregunta":"¿Por qué no se hacen las actividades?","definicion":"Distribución de las actividades reportadas como no realizadas, por motivo.","formula":"reportadas como no realizadas con el motivo M ÷ reportadas como no realizadas × 100","numerador":"Reportes con SE_REALIZO = No y el motivo M","denominador":"Reportes con SE_REALIZO = No","unidad":"%","sentido":"info","fuente":["Reportes"],"columnas":["SE_REALIZO","MOTIVO_NO_REALIZACION","REPROGRAMADA"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","motivo"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Propuesta P1. Separa lo que no se hizo de lo que no se reportó."},{"id":"K3","grupo":"A","nombre":"Puntualidad","pregunta":"¿Se hace la actividad el día programado?","definicion":"Porcentaje de actividades realizadas en la fecha agendada; se informa también el desfase promedio en días.","formula":"realizadas en la fecha agendada ÷ realizadas con fecha agendada × 100","numerador":"Realizadas cuya fecha real es igual a la agendada","denominador":"Realizadas con fecha agendada conocida","unidad":"%","sentido":"sube","fuente":["Agendamiento","Reportes"],"columnas":["AG: FECHA","RP: FECHA, FECHA_AGENDADA, DIAS_DESFASE"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K4","grupo":"A","nombre":"Programación oportuna","pregunta":"¿Se agenda antes de hacer la actividad?","definicion":"Porcentaje de actividades agendadas antes de su hora de inicio (el mismo día cuenta; decisión del 23-nov-2026). Se informa aparte cuántas se agendaron con 1 día o más de anticipación.","formula":"agendadas antes de la hora de inicio ÷ agendadas × 100","numerador":"Agendamientos registrados antes de la fecha y hora de inicio de la actividad (sin hora: el mismo día cuenta)","denominador":"Agendamientos con fecha en el periodo","unidad":"%","sentido":"sube","fuente":["Agendamiento"],"columnas":["MARCA_TEMPORAL (A)","FECHA (V)","HORA (W)","AGENDADA_DESPUES"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"sí","desde":"histórico","meta":"≥ 50 % (aprobada por el administrador del sistema el 23-nov-2026; pendiente de aval de la gerencia)","meta_valor":50,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Línea base anterior (C-00): 46,9 % de los agendamientos se registraron después del día de la actividad."},{"id":"K5","grupo":"A","nombre":"Oportunidad del reporte","pregunta":"¿Se reporta a tiempo?","definicion":"Porcentaje de reportes enviados a más tardar 3 días después de la actividad; se informa también la mediana de días.","formula":"reportes con (fecha del reporte − fecha de la actividad) ≤ 3 días ÷ reportes × 100","numerador":"Reportes enviados en 3 días o menos","denominador":"Reportes de actividades realizadas en el periodo","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["MARCA_TEMPORAL","FECHA","DIAS_REPORTE"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"sí","desde":"histórico","meta":"≥ 80 % (aprobada por el administrador del sistema el 23-nov-2026; pendiente de aval de la gerencia)","meta_valor":80,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K6","grupo":"A","nombre":"Cumplimiento de la duración","pregunta":"¿Las actividades duran lo planeado?","definicion":"Duración real frente a la duración agendada, en promedio.","formula":"promedio de (duración real ÷ duración agendada) × 100","numerador":"Suma de las razones duración real ÷ agendada","denominador":"Realizadas con las dos duraciones","unidad":"%","sentido":"info","fuente":["Agendamiento","Reportes"],"columnas":["AG: DURACION_MIN","RP: DURACION_MIN"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"100 % = duró lo planeado. El Agendamiento anterior no pedía duración."},{"id":"K7","grupo":"B","nombre":"Cobertura de problemáticas","pregunta":"¿Qué parte de los casos recibe atención?","definicion":"Porcentaje de casos (no descartados) registrados hasta el corte que tienen al menos una actividad realizada.","formula":"casos con ≥ 1 actividad realizada ÷ casos no descartados × 100","numerador":"Casos con al menos un reporte «Sí, se realizó» de una actividad que los atiende","denominador":"Casos registrados hasta el corte, sin DESCARTADO","unidad":"%","sentido":"sube","fuente":["Problemáticas","Agendamiento","Reportes"],"columnas":["PR: ID_PROBLEMATICA, ESTADO","AG: ID_PROBLEMATICA","RP: ID_PROBLEMATICA, SE_REALIZO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ","eje"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Los casos históricos (DTH-) no tienen actividades unidas: el indicador empieza con el sistema nuevo."},{"id":"K8","grupo":"B","nombre":"Cobertura de prioridad alta","pregunta":"¿Atendemos primero lo más grave?","definicion":"Lo mismo que K7, solo para los casos de prioridad ALTA.","formula":"casos ALTA con ≥ 1 actividad realizada ÷ casos ALTA no descartados × 100","numerador":"Casos ALTA con al menos una actividad realizada","denominador":"Casos ALTA no descartados","unidad":"%","sentido":"sube","fuente":["Problemáticas","Agendamiento","Reportes"],"columnas":["PR: PRIORIDAD"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K9","grupo":"B","nombre":"Tiempo de respuesta","pregunta":"¿Cuánto tardamos en actuar?","definicion":"Mediana de días entre el registro del caso y su primera actividad realizada.","formula":"mediana(fecha de la primera actividad realizada − fecha de registro del caso)","numerador":"Días por caso atendido","denominador":"Casos con al menos una actividad realizada","unidad":"días","sentido":"baja","fuente":["Problemáticas","Reportes"],"columnas":["PR: FECHA_REGISTRO","RP: FECHA"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ","prioridad"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K10","grupo":"B","nombre":"Tasa de resolución","pregunta":"¿Cuántos casos intervenidos se mitigan?","definicion":"Porcentaje de los casos que estuvieron EN INTERVENCIÓN y hoy están MITIGADOS (con resultado verificado).","formula":"casos MITIGADO ÷ casos que estuvieron EN INTERVENCIÓN × 100","numerador":"Casos en estado MITIGADO al corte","denominador":"Casos que pasaron por EN INTERVENCIÓN","unidad":"%","sentido":"sube","fuente":["Problemáticas","HISTORIAL_ESTADOS"],"columnas":["ESTADO","HISTORIAL_ESTADOS","VERIFICACION_RESULTADO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ","eje"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Propuesta P2: «Sí» sin verificación no mitiga. Lo responde quien hizo la actividad."},{"id":"K11","grupo":"B","nombre":"Persistencia","pregunta":"¿Vuelven los problemas mitigados?","definicion":"Porcentaje de los casos que llegaron a MITIGADO y luego volvieron a PERSISTENTE.","formula":"casos MITIGADO → PERSISTENTE ÷ casos que llegaron a MITIGADO × 100","numerador":"Casos con la transición MITIGADO → PERSISTENTE","denominador":"Casos que llegaron a MITIGADO","unidad":"%","sentido":"baja","fuente":["HISTORIAL_ESTADOS"],"columnas":["HISTORIAL_ESTADOS"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K12","grupo":"B","nombre":"Esfuerzo por caso resuelto","pregunta":"¿Cuánto cuesta resolver un caso?","definicion":"Promedio de actividades realizadas y de horas-funcionario por caso MITIGADO.","formula":"actividades realizadas (y horas-funcionario) de los casos MITIGADO ÷ casos MITIGADO","numerador":"Actividades realizadas de los casos MITIGADO","denominador":"Casos MITIGADO","unidad":"n","sentido":"info","fuente":["Problemáticas","Reportes"],"columnas":["RP: ID_PROBLEMATICA, HORAS_FUNCIONARIO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["eje"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K13","grupo":"C","nombre":"Personas alcanzadas","pregunta":"¿A cuántas personas llegamos?","definicion":"Estimación con rango de las personas que asistieron a las actividades realizadas: suma de los mínimos y de los máximos de cada rango (la cifra exacta cuando se contó).","formula":"Σ mínimo del rango … Σ máximo del rango","numerador":"Suma de los mínimos","denominador":"Suma de los máximos (abierto si hay «Más de 100» o «20 o más»)","unidad":"personas","sentido":"sube","fuente":["Reportes"],"columnas":["N_ASISTENTES","ASISTENTES_EXACTO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Siempre se informa como rango, nunca como cifra exacta. Los rangos del formulario anterior (1 a 5 · 5 a 12 · 12 a 20 · 20 o más) se calculan aparte."},{"id":"K14","grupo":"C","nombre":"Cumplimiento de la convocatoria","pregunta":"¿Llega la gente que esperábamos?","definicion":"Porcentaje de actividades realizadas con igual o más asistentes que el rango esperado.","formula":"actividades con DIF_ASISTENTES IGUAL o MÁS ÷ actividades con los dos rangos × 100","numerador":"Actividades IGUAL o MÁS","denominador":"Actividades con rango esperado y real","unidad":"%","sentido":"sube","fuente":["Agendamiento","Reportes"],"columnas":["ASISTENTES_ESPERADOS","N_ASISTENTES","DIF_ASISTENTES"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área"],"linea_base":"no","desde":"producción","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K15","grupo":"C","nombre":"Enfoque diferencial","pregunta":"¿Llegamos a las poblaciones prioritarias?","definicion":"Porcentaje de actividades realizadas que atendieron al menos una población distinta de «Población general».","formula":"actividades con población diferencial ÷ actividades con población registrada × 100","numerador":"Actividades con NNA, jóvenes, mujeres VBG, migrantes, habitantes de calle, LGBTIQ+…","denominador":"Actividades con población registrada","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["POBLACION_ATENDIDA"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","población"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K16","grupo":"C","nombre":"Cobertura territorial","pregunta":"¿Dónde actuamos?","definicion":"Actividades realizadas por UPZ, frente a los casos abiertos de cada UPZ.","formula":"actividades realizadas en la UPZ (y casos abiertos en la UPZ)","numerador":"Actividades realizadas","denominador":"—","unidad":"n","sentido":"info","fuente":["Reportes","Problemáticas"],"columnas":["UPZ","ZONA","COD_BARRIO"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["UPZ","zona"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K17","grupo":"C","nombre":"Horas en territorio","pregunta":"¿Cuánto tiempo dedicamos al territorio?","definicion":"Horas-funcionario en actividades realizadas: duración × número de funcionarios participantes.","formula":"Σ duración (h) × funcionarios","numerador":"Horas-funcionario","denominador":"—","unidad":"horas","sentido":"sube","fuente":["Reportes"],"columnas":["HORAS_FUNCIONARIO","DURACION","OTROS_FUNCIONARIOS (solo se cuentan)"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área"],"linea_base":"parcial","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Histórico: estimación con el punto medio del rango de duración (Menos de 1 hora = 0,5 · 1 a 2 = 1,5 · 2 a 4 = 3 · Más de 4 = 4, mínimo)."},{"id":"K18","grupo":"D","nombre":"Cambio en la percepción de seguridad","pregunta":"¿Se siente más segura la comunidad?","definicion":"Porcentaje de actividades donde se midió la percepción y mejoró (levemente o significativamente).","formula":"actividades con «Mejoró» ÷ actividades donde se midió la percepción × 100","numerador":"PERCEPCION_DESPUES = Mejoró levemente o significativamente","denominador":"Actividades con la percepción medida (antes y después)","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["PERCEPCION_ANTES","PERCEPCION_DESPUES","MEDICION_PERCEPCION"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"parcial","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"Siempre se informa cuántas actividades la midieron. En el histórico no se midió en el 59 %."},{"id":"K19","grupo":"D","nombre":"Participación comunitaria","pregunta":"¿Participa la comunidad?","definicion":"Porcentaje de actividades con participación ALTA o MEDIA (sin contar «No aplica»).","formula":"actividades ALTA o MEDIA ÷ actividades con participación evaluada × 100","numerador":"ALTA o MEDIA","denominador":"ALTA, MEDIA, BAJA o NULA","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["NIVEL_PARTICIPACION"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área","UPZ"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K20","grupo":"D","nombre":"Compromisos generados","pregunta":"¿Las actividades dejan acuerdos?","definicion":"Porcentaje de actividades realizadas con compromisos.","formula":"actividades con compromisos ÷ actividades realizadas × 100","numerador":"SE_GENERARON_COMPROMISOS = Sí","denominador":"Actividades con la pregunta respondida","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["SE_GENERARON_COMPROMISOS","TIPO_COMPROMISOS"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","área"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"El cumplimiento de los compromisos queda para una versión posterior."},{"id":"K21","grupo":"D","nombre":"Detección de problemáticas en terreno","pregunta":"¿Qué vemos al salir?","definicion":"Porcentaje de actividades en las que se observó al menos una problemática, y conteo por tipo.","formula":"actividades con ≥ 1 problemática observada ÷ actividades con la pregunta respondida × 100","numerador":"Actividades con alguna problemática observada","denominador":"Actividades con la pregunta respondida","unidad":"%","sentido":"info","fuente":["Reportes"],"columnas":["PROBLEMATICAS","PROBLEMATICAS_OBSERVADAS"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["mes","UPZ","problemática"],"linea_base":"sí","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":""},{"id":"K22","grupo":"E","nombre":"Actividades por estrategia y línea PISCCJ","pregunta":"¿A qué parte del PISCCJ aportamos?","definicion":"Actividades realizadas por estrategia (Seguridad, Convivencia, Justicia, Transversal) y por línea principal.","formula":"actividades realizadas por estrategia / línea","numerador":"Actividades realizadas","denominador":"—","unidad":"n","sentido":"info","fuente":["Agendamiento","Reportes"],"columnas":["LINEA_ESTRATEGICA","COD_LINEA_PRINCIPAL","PISCCJ_LINEAS"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)","dimensiones":["estrategia","línea PISCCJ"],"linea_base":"parcial","desde":"histórico","meta":"Por definir por la gerencia","meta_valor":null,"responsable":"Coordinación CONVIVE 360° (por designar)","notas":"En el histórico, PISCCJ_LINEAS está vacía en el 41 %: se usa la estrategia."},{"id":"K23","grupo":"E","nombre":"Aporte a las acciones del PISCCJ","pregunta":"¿Ejecutamos las acciones del plan distrital?","definicion":"Porcentaje de actividades realizadas que ejecutaron una acción del PISCCJ, y conteo por acción.","formula":"actividades con acción PISCCJ ÷ actividades con la pregunta respondida × 100","numerador":"COD_ACCION_PISCCJ distinto de NINGUNA","denominador":"Actividades con COD_ACCION_PISCCJ","unidad":"%","sentido":"sube","fuente":["Reportes"],"columnas":["COD_ACCION_PISCCJ","PISCCJ_INDICADORES"],"periodicidad":"Mensual (corte a fin de mes, con 3 días de gracia)" <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FICHA = Object.fromEntries(D.fichas.map(f => [f.id, f]));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nomMes = p => p === 'TOTAL' ? 'Todo el periodo' : MESES[+p.slice(5) - 1] + ' ' + p.slice(0, 4);
const fmt = n => n == null ? '—' : Number(n).toLocaleString('es-CO', { maximumFractionDigits: 1 });
let filtro = { p: 'TOTAL', d: 'total', v: '' };
try { const g = JSON.parse(localStorage.getItem('cv360_tablero') || 'null'); if (g) filtro = Object.assign(filtro, g); } catch (e) {}

function fila(k, p, d, v) { return D.ind.find(r => r.k === k && r.p === p && r.d === d && (r.dv || '') === (v || '')); }
function actual(k) {
  // TOTAL por dimensión existe solo en el periodo completo; los meses se calculan para el total de la localidad.
  if (filtro.d !== 'total' && filtro.v) return fila(k, 'TOTAL', filtro.d, filtro.v) || null;
  return fila(k, filtro.p, 'total', '') || (filtro.p === 'TOTAL' ? null : fila(k, 'TOTAL', 'total', ''));
}
function estado(f, r) {
  if (!r || r.v == null) return ['sindatos', 'sin datos'];
  if (f.meta_valor == null) return ['sinmeta', 'sin meta'];
  const ok = f.sentido === 'baja' ? r.v <= f.meta_valor : r.v >= f.meta_valor;
  return ok ? ['cumple', '✔ cumple la meta'] : ['nocumple', '✘ bajo la meta'];
}

function pintarMetas() {
  $('metas').innerHTML = ['K1', 'K4', 'K5', 'K28'].map(k => {
    const f = FICHA[k], r = actual(k), [cl, tx] = estado(f, r);
    const v = r && r.v != null ? r.v : null;
    return `<button class="meta" type="button" data-ficha="${k}" aria-label="Ver la ficha de ${esc(f.nombre)}">
      <span class="et">${k} · ${esc(f.nombre)}</span>
      <span class="val">${v == null ? 'sin datos' : fmt(v) + ' %'}</span>
      <span class="fr">${r && r.den ? fmt(r.n) + ' de ' + fmt(r.den) : ''} · meta ${esc(f.meta.split(' (')[0])}</span>
      <span class="prog" aria-hidden="true"><i style="width:${Math.min(100, v || 0)}%"></i><b style="left:${f.meta_valor}%"></b></span>
      <span class="pill ${cl}">${tx}</span></button>`;
  }).join('');
}

function filaIndicador(f) {
  const r = actual(f.id);
  let valor;
  if (['K13', 'K22', 'K26'].includes(f.id)) {
    const dims = { K13: ['total'], K22: ['estrategia'], K26: ['total', 'resultado'] }[f.id];
    const rs = D.ind.filter(x => x.k === f.id && x.p === 'TOTAL' && dims.includes(x.d)).slice(0, 4);
    valor = `<div class="valor" style="font-size:14px">${rs.map(x => (x.dv && f.id !== 'K13' ? esc(x.dv) + ': ' : '') + esc(x.t)).join('<br>') || 'sin datos'}</div>`;
  } else if (!r || r.v == null) {
    valor = `<div class="valor sd">sin datos<small>${f.linea_base === 'no' ? 'se mide desde la producción' : ''}</small></div>`;
  } else {
    const u = f.unidad === '%' ? ' %' : f.unidad === 'días' ? ' días' : f.unidad === 'horas' ? ' h' : '';
    valor = `<div class="valor">${fmt(r.v)}${u}<small>${r.den && f.unidad === '%' ? fmt(r.n) + ' de ' + fmt(r.den) : ''}</small></div>`;
  }
  const [cl, tx] = estado(f, r);
  return `<div class="fila"><span class="kid">${f.id}</span>
    <div class="nom">${esc(f.nombre)}<small>${esc(f.pregunta)}</small></div>${valor}
    <div class="nota">${esc(r ? r.nota : '')}</div>
    <div class="mini">${f.meta_valor != null ? `<span class="pill ${cl}">${tx}</span>` : ''}<button class="lnk" type="button" data-ficha="${f.id}">Ficha</button></div></div>`;
}

function barras(rs, meta, sufijo) {
  if (!rs.length) return '<div class="barras"><span class="nota">sin datos</span></div>';
  const max = Math.max(100, ...rs.map(r => r.v || 0));
  return '<div class="barras">' + rs.map(r => `<div class="barra"><span>${esc(r.et)}</span>
    <span class="pista" role="img" aria-label="${esc(r.et)}: ${fmt(r.v)}${sufijo}"><i style="width:${(r.v || 0) / max * 100}%"></i>${meta != null ? `<b style="left:${meta / max * 100}%"></b>` : ''}</span>
    <span class="num">${fmt(r.v)}${sufijo}${r.den ? ' · ' + fmt(r.n) + '/' + fmt(r.den) : ''}</span></div>`).join('') + '</div>';
}

function graficoMeses(k) {
  const rs = D.ind.filter(r => r.k === k && r.p !== 'TOTAL' && r.d === 'total' && r.v != null);
  if (!rs.length) return '';
  const W = 560, H = 190, pl = 34, pb = 26, pt = 14, an = (W - pl - 10) / rs.length, meta = FICHA[k].meta_valor;
  const y = v => pt + (H - pt - pb) * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(FICHA[k].nombre)} por mes" style="width:100%;height:auto;display:block">`;
  [0, 50, 100].forEach(t => { s += `<line x1="${pl}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--borde)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`; });
  if (meta != null) s += `<line x1="${pl}" x2="${W - 10}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--mal)" stroke-dasharray="4 4"/><text x="${W - 12}" y="${y(meta) - 5}" text-anchor="end">meta ${meta} %</text>`;
  rs.forEach((r, i) => {
    const x = pl + i * an + an * .18, w = an * .64, cnt = r.den || 0;
    s += `<rect x="${x}" y="${y(r.v)}" width="${w}" height="${y(0) - y(r.v)}" rx="3" fill="${cnt < 30 ? 'var(--barra)' : 'var(--teal)'}"><title>${nomMes(r.p)}: ${fmt(r.v)} % (${fmt(r.n)} de ${fmt(r.den)})</title></rect>`;
    s += `<text x="${x + w / 2}" y="${y(r.v) - 4}" text-anchor="middle">${fmt(r.v)}</text><text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${MESES[+r.p.slice(5) - 1].slice(0, 3)}</text>`;
  });
  return s + '</svg>';
}

function pintar() {
  const r = D.resumen;
  $('sub').textContent = `Alcaldía Local de San Cristóbal · actividades del ${r.desde} al ${r.hasta} · corte ${r.corte} · gracia de ${r.gracia_dias} días` +
    (r.calculado ? ` · actualizado ${String(r.calculado).replace('T', ' ').slice(0, 16)}` : '');
  if (D.excel) $('lnkExcel').href = D.excel; else $('lnkExcel').hidden = true;
  if (D.boletin) $('lnkBoletin').href = D.boletin; else $('lnkBoletin').hidden = true;
  $('aviso').innerHTML = (filtro.d !== 'total' && filtro.v ? `Mostrando <b>${esc(filtro.v)}</b> (${esc(filtro.d)}) para todo el periodo. ` : '') +
    (filtro.p !== 'TOTAL' && filtro.d === 'total' ? `Mostrando <b>${nomMes(filtro.p)}</b>. Los indicadores que no se calculan por mes muestran el periodo completo. ` : '') +
    'La población se informa siempre como estimación con rango. «sin datos» = el indicador se mide desde la puesta en producción del sistema nuevo. Octubre y noviembre: pausa pedida por la gerencia, pocas actividades.';
  pintarMetas();
  let h = '';
  for (const [g, tit] of Object.entries(D.grupos)) {
    const [a, b] = tit.split(' · ');
    h += `<section class="grupo" aria-labelledby="g${g}"><h2 id="g${g}"><span class="l">${g}</span>${esc(a)} <small>${esc(b || '')}</small></h2>`;
    h += D.fichas.filter(f => f.grupo === g).map(filaIndicador).join('');
    if (g === 'A') {
      const area = D.ind.filter(x => x.k === 'K1' && x.d === 'área').map(x => ({ et: x.dv, v: x.v, n: x.n, den: x.den }));
      const upz = D.ind.filter(x => x.k === 'K1' && x.d === 'UPZ').map(x => ({ et: 'UPZ ' + x.dv, v: x.v, n: x.n, den: x.den }));
      h += `<div class="dos"><div><h3>K1 por mes</h3><div style="padding:6px 18px 12px">${graficoMeses('K1')}<span class="nota">Barras claras: meses con menos de 30 actividades.</span></div></div>
            <div><h3>K1 por área</h3>${barras(area, 90, ' %')}<h3>K1 por UPZ</h3>${barras(upz, 90, ' %')}</div></div>`;
    }
    h += '</section>';
  }
  h += `<section class="grupo" aria-labelledby="gMapa"><h2 id="gMapa"><span class="l">K29</span>Mapa de las actividades realizadas <small>puntos dentro del límite oficial de San Cristóbal</small></h2>
        <div id="mapa" role="application" aria-label="Mapa de las actividades realizadas en San Cristóbal"></div>
        <div class="leyenda" id="leyenda"></div></section>`;
  h += `<section class="grupo" aria-labelledby="gHall"><h2 id="gHall"><span class="l">!</span>Hallazgos de calidad del dato <small>error humano, de sistema o por revisar</small></h2>
        <div class="tabla"><table><thead><tr><th>Hallazgo</th><th>Tipo</th><th style="text-align:right">N</th></tr></thead><tbody>${D.hallazgos.map(x =>
        `<tr><td>${esc(x.h)}</td><td><span class="tipo ${x.tipo === 'por revisar' ? 'revisar' : esc(x.tipo)}">${esc(x.tipo)}</span></td><td style="text-align:right">${fmt(x.n)}</td></tr>`).join('')}</tbody></table></div>
        ${D.auditoria ? `<div class="leyenda">Detalle en el Excel: ${fmt(D.auditoria.prog_no_ejecutadas)} programadas no ejecutadas · ${fmt(D.auditoria.ejec_sin_programacion)} reportes sin programación · ${fmt(D.auditoria.duplicados)} códigos con reportes repetidos.</div>` : ''}</section>`;
  $('contenido').innerHTML = h;
  $('pie').textContent = 'CONVIVE 360° · Modelo GESEG · Alcaldía Local de San Cristóbal (Localidad 4). Cálculo: motor C-07 (pruebas OK) y fichas del catálogo de indicadores. ' +
    (D.ruta ? 'Datos agregados que se actualizan cada noche; sin datos personales; ubicaciones aproximadas (±110 m).' : 'Uso interno: sin datos personales.');
  mapa();
}

let M = null;
function mapa() {
  if (!window.L) { $('mapa').innerHTML = '<div class="aviso" style="margin:16px">No se pudo cargar el mapa (sin conexión).</div>'; return; }
  if (M) { M.remove(); M = null; }
  M = L.map('mapa', { scrollWheelZoom: false });
  const ll = p => [p[1], p[0]];
  // mismo mapa base de los formularios: IDECA (Catastro Bogotá) y, si falla, CARTO
  const fondo = L.tileLayer('https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/mapa_base_3857/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 20, attribution: 'Mapa base IDECA – UAECD · límite SDP' }).addTo(M);
  let fallas = 0;
  fondo.on('tileerror', () => { if (++fallas === 4) L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
    { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap · © CARTO · límite SDP' }).addTo(M).bringToBack(); });
  // localidad = [polígono], polígono = [anillo], anillo = [[lon, lat], …]
  const lim = L.polygon(D.limite.map(pol => pol.map(anillo => anillo.map(ll))), { color: '#0d1f3c', weight: 2.5, fill: false }).addTo(M);
  M.fitBounds(lim.getBounds(), { padding: [10, 10] });
  const pts = D.puntos.filter(p => p.tipo === 'actividad' && (filtro.p === 'TOTAL' || p.mes === filtro.p) &&
    (filtro.d !== 'área' || !filtro.v || p.area === filtro.v) && (filtro.d !== 'UPZ' || !filtro.v || p.upz === filtro.v));
  pts.forEach(p => L.circleMarker([p.lat, p.lon], { radius: p.n > 1 ? Math.min(10, 4 + Math.sqrt(p.n) * 1.5) : 4, weight: 1, color: '#0d1f3c', fillColor: '#2e86ab', fillOpacity: .75 })
    .bindTooltip(`${esc(p.area)} · UPZ ${esc(p.upz)} · ${esc(p.mes)}${p.n > 1 ? ' · ' + p.n + ' actividades' : ''}`).addTo(M));
  const nPts = pts.reduce((s, p) => s + (p.n || 1), 0);
  const casos = D.puntos.filter(p => p.tipo === 'caso');
  casos.forEach(p => L.circleMarker([p.lat, p.lon], { radius: 6, weight: 2, color: '#c0392b', fillColor: '#fff', fillOpacity: 1 }).bindTooltip(`Caso ${esc(p.estado)} · ${esc(p.prioridad)}`).addTo(M));
  $('leyenda').innerHTML = `<span><i class="punto" style="background:#2e86ab"></i>${fmt(nPts)} actividades realizadas con punto${D.ruta ? ' (ubicación aproximada, ±110 m)' : ''}</span>` +
    (D.ruta ? '' : `<span><i class="punto" style="background:#fff;border:2px solid #c0392b"></i>${casos.length ? fmt(casos.length) + ' casos abiertos' : 'casos abiertos: aparecerán con el sistema nuevo (Módulo 1)'}</span>`);
}

function verFicha(k) {
  const f = FICHA[k];
  const filas = [['Definición', f.definicion], ['Fórmula', f.formula], ['Numerador', f.numerador], ['Denominador', f.denominador], ['Unidad', f.unidad],
    ['Sentido', { sube: 'Más es mejor', baja: 'Menos es mejor', info: 'Descriptivo' }[f.sentido]], ['Fuente', f.fuente.join(', ')], ['Columnas', f.columnas.join(' · ')],
    ['Periodicidad', f.periodicidad], ['Desglose', f.dimensiones.join(', ')], ['Línea base', f.linea_base + ' · se mide desde: ' + f.desde], ['Meta', f.meta],
    ['Responsable', f.responsable], ['Notas', f.notas]].filter(x => x[1]);
  $('dlgCuerpo').innerHTML = `<h3>${f.id} · ${esc(f.nombre)}</h3><div class="pq">${esc(f.pregunta)} · Grupo ${f.grupo}</div>
    <dl>${filas.map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl><footer><button class="btn claro" type="button" id="cerrar">Cerrar</button></footer>`;
  if (!$('dlg').open) $('dlg').showModal(); $('cerrar').onclick = () => $('dlg').close();
}
function verFichas() {
  $('dlgCuerpo').innerHTML = `<h3>Fichas de los indicadores</h3><div class="pq">Toque un indicador para ver su ficha completa.</div>
    <dl>${D.fichas.map(f => `<dt>${f.id}</dt><dd><button class="lnk" type="button" data-ficha="${f.id}">${esc(f.nombre)}</button></dd>`).join('')}</dl>
    <footer><button class="btn claro" type="button" id="cerrar">Cerrar</button></footer>`;
  $('dlg').open || $('dlg').showModal(); $('cerrar').onclick = () => $('dlg').close();
}

function filtros() {
  const meses = [...new Set(D.ind.filter(r => r.k === 'K1' && r.p !== 'TOTAL').map(r => r.p))].sort();
  $('fMes').innerHTML = ['TOTAL', ...meses].map(p => `<option value="${p}">${nomMes(p)}</option>`).join('');
  const valores = () => [...new Set(D.ind.filter(r => r.k === 'K1' && r.d === filtro.d).map(r => r.dv))];
  const sync = () => {
    $('fMes').value = filtro.p; $('fDim').value = filtro.d;
    $('lblVal').hidden = filtro.d === 'total'; $('fMes').disabled = filtro.d !== 'total';
    if (filtro.d !== 'total') { const vs = valores(); if (!vs.includes(filtro.v)) filtro.v = vs[0] || '';
      $('fVal').innerHTML = vs.map(v => `<option value="${esc(v)}">${filtro.d === 'UPZ' ? 'UPZ ' : ''}${esc(v)}</option>`).join(''); $('fVal').value = filtro.v; }
    else filtro.v = '';
    try { localStorage.setItem('cv360_tablero', JSON.stringify(filtro)); } catch (e) {}
    pintar();
  };
  $('fMes').onchange = e => { filtro.p = e.target.value; sync(); };
  $('fDim').onchange = e => { filtro.d = e.target.value; filtro.p = 'TOTAL'; sync(); };
  $('fVal').onchange = e => { filtro.v = e.target.value; sync(); };
  sync();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-ficha]'); if (b) verFicha(b.dataset.ficha); if (e.target.id === 'btnFichas') verFichas(); });
// Versión pública: los datos se traen de la ruta del servicio (cálculo nocturno); la interna los trae incrustados.
async function iniciar() {
  if (D.ruta) {
    $('contenido').innerHTML = '<div class="aviso">Cargando los indicadores del último cálculo…</div>';
    try {
      const resp = await fetch(D.ruta, { cache: 'no-store' });
      const j = await resp.json();
      if (j.status !== 'ok') throw new Error(j.msg || 'respuesta no válida');
      D.resumen = j.resumen;
      D.ind = j.indicadores.map(x => ({ k: x.K, p: String(x.periodo), d: x.dimension, dv: x.valor_dimension == null || x.valor_dimension === '' ? null : String(x.valor_dimension),
        v: x.valor, n: x.numerador, den: x.denominador, t: x.texto, nota: x.nota || '' }));
      D.hallazgos = (j.hallazgos || []).map(h => ({ id: h.id, h: h.hallazgo, tipo: h.tipo, n: h.n }));
      D.puntos = ((j.mapa && j.mapa.puntos) || []).map(p => ({ tipo: 'actividad', lat: p[0], lon: p[1], mes: p[2], area: p[3], upz: p[4], n: p[5] }));
    } catch (e) {
      $('contenido').innerHTML = '<div class="aviso">No se pudieron cargar los indicadores (' + esc(e.message) + '). Revise la conexión e intente de nuevo en unos minutos.</div>';
      return;
    }
  }
  filtros();
}
iniciar();
</script>
